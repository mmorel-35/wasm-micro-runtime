name: Bazel build and test

on:
  # will be triggered on PR events
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - ".github/workflows/bazel_build_test.yml"
      - "BUILD.bazel"
      - "MODULE.bazel"
      - ".bazelrc"
      - "bazel/**"
      - "core/**"
      - "!core/deps/**"
      - "examples/simple-bazel-example/**"
  # will be triggered on push events
  push:
    branches:
      - main
      - "dev/**"
    paths:
      - ".github/workflows/bazel_build_test.yml"
      - "BUILD.bazel"
      - "MODULE.bazel"
      - ".bazelrc"
      - "bazel/**"
      - "core/**"
      - "!core/deps/**"
      - "examples/simple-bazel-example/**"
  # allow to be triggered manually
  workflow_dispatch:

# Cancel any in-flight jobs for the same PR/branch so there's only one active
# at a time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bazel_build_default:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.8.5
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Build vmlib (default - no JIT)
        run: |
          bazel build //:vmlib --verbose_failures

      - name: Build all components
        run: |
          bazel build //core/... --verbose_failures

      - name: Build simple example
        run: |
          bazel build //examples/simple-bazel-example:wamr_example --verbose_failures

      - name: Run simple example test
        run: |
          bazel test //examples/simple-bazel-example:wamr_test --verbose_failures --test_output=all

  bazel_build_jit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
        # Note: Building LLVM takes significant time, so we limit platforms
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.8.5
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-jit
          repository-cache: true

      - name: Build vmlib_jit (with LLVM)
        run: |
          bazel build //:vmlib_jit --verbose_failures
        timeout-minutes: 60

  bazel_build_windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.8.5
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Build vmlib (default - no JIT)
        shell: bash
        run: |
          bazel build //:vmlib --verbose_failures

      - name: Build simple example
        shell: bash
        run: |
          bazel build //examples/simple-bazel-example:wamr_example --verbose_failures
